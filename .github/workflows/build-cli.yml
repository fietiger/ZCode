name: Build ZCode CLI

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL baked into install.sh (only used by that script)"
        required: false
        default: "https://github.com/fietiger/ZCode/releases/download/cli-dist/"
  push:
    tags:
      - "zcode-cli-*"

permissions:
  contents: read

concurrency:
  group: zcode-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build linux-x64 CLI distribution
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_VERSION: "24.14.0"
      PNPM_VERSION: "10.33.2"
      # The desktop runtime is not part of the CLI distribution; skip the binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      COREPACK_ENABLE_PROJECT_SPEC: "0"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Report toolchain
        run: |
          node --version
          pnpm --version
          df -h "$RUNNER_TEMP" | tail -1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @zcode/shared is the only source-only workspace package in the CLI/TUI
      # closure: it has no `build` script, so turbo never emits its dist/.
      # The TUI asset collector requires dist/index.js for every workspace
      # package it walks, so emit it explicitly first. (@zcode/zcode-cua also
      # has no build script but ships hand-written JS, so it needs nothing.)
      - name: Build source-only workspace packages
        run: pnpm exec tsc -b packages/shared

      - name: Build CLI distribution
        run: node scripts/build-zcode-cli-only.mjs --target linux-x64 --base-url "${{ inputs.base_url || 'https://github.com/fietiger/ZCode/releases/download/cli-dist/' }}"

      - name: Locate artifacts
        id: artifacts
        run: |
          set -euo pipefail
          latest="$(cat dist/zcode-cli/latest.json)"
          version="$(printf '%s' "$latest" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).version))")"
          tarball="$(printf '%s' "$latest" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).tarball))")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "path=dist/zcode-cli/releases/$version/$tarball" >> "$GITHUB_OUTPUT"
          ls -la "dist/zcode-cli/releases/$version/"
          du -sh "dist/zcode-cli/releases/$version/$tarball"

      # `zcode.mjs` without `--web` only loads the agent bundle, but the TUI
      # resolves @zcode/tui and playwright-core from agent/node_modules at
      # runtime, so assert both are present before declaring the build good.
      - name: Smoke test the packaged CLI
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work"
          tar -xzf "${{ steps.artifacts.outputs.path }}" -C "$work"
          runtime="$work/zcode"
          test -f "$runtime/bin/zcode.mjs"
          test -f "$runtime/agent/zcode.cjs"
          test -f "$runtime/agent/provider/zcode-builtin.json"
          test -f "$runtime/agent/node_modules/@zcode/tui/package.json"
          test -f "$runtime/agent/node_modules/playwright-core/package.json"
          node "$runtime/bin/zcode.mjs" --version
          echo "--- CLI-only package does not ship web/server (expected) ---"
          test ! -d "$runtime/web" && echo "confirmed: no web/ dir"
          test ! -d "$runtime/server" && echo "confirmed: no server/ dir"

      - name: Upload CLI distribution
        uses: actions/upload-artifact@v4
        with:
          name: zcode-cli-linux-x64
          path: |
            dist/zcode-cli/releases/${{ steps.artifacts.outputs.version }}/*.tar.gz
            dist/zcode-cli/releases/${{ steps.artifacts.outputs.version }}/sha256.txt
            dist/zcode-cli/install.sh
            dist/zcode-cli/latest.json
          retention-days: 90
          if-no-files-found: error